name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Redmine ${{ matrix.redmine_branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redmine_branch: ['7.0-stable', 'master']
        with_additionals: [false]
        include:
          # отдельный джоб: additionals установлен — проверяется блок дашборда
          - redmine_branch: '7.0-stable'
            with_additionals: true
    steps:
      - name: Clone Redmine ${{ matrix.redmine_branch }}
        uses: actions/checkout@v4
        with:
          repository: redmine/redmine
          ref: ${{ matrix.redmine_branch }}

      - name: Install additionals (job checks dashboard block)
        if: matrix.with_additionals
        run: git clone --depth 1 https://github.com/alphanodes/additionals plugins/additionals

      - name: Install plugin as plugins/redmine_web_window
        uses: actions/checkout@v4
        with:
          path: plugins/redmine_web_window

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Configure sqlite test database
        run: |
          cat > config/database.yml <<'EOF'
          test:
            adapter: sqlite3
            database: db/test.sqlite3
          EOF

      - name: Bundle install
        run: bundle install --jobs 4 --without development

      - name: Migrate test database
        run: |
          set -o pipefail
          bundle exec rake db:create db:migrate RAILS_ENV=test 2>&1 | tee migrate_output.txt

      - name: Static checks (python)
        run: python3 check_redmine_plugin.py
        working-directory: plugins/redmine_web_window

      - name: Plugin tests
        run: |
          set -o pipefail
          bundle exec rake redmine:plugins:test NAME=redmine_web_window RAILS_ENV=test 2>&1 | tee ci_output.txt

      - name: Report failure details
        if: failure()
        run: |
          {
            echo "### Plugin tests — хвост вывода"
            echo '```'
            tail -n 80 ci_output.txt 2>/dev/null || true
            echo '```'
            echo "### log/test.log — хвост"
            echo '```'
            tail -n 30 log/test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # самые информативные строки — в аннотации прогона (читаются через API)
          {
            tail -n 200 ci_output.txt 2>/dev/null || true
            tail -n 60 migrate_output.txt 2>/dev/null || true
          } | grep -aE "^[[:space:]]*[0-9]+\) |Failure:|Error:|Expected|WebWindow|WebWindowMacroTest#|[0-9]+ runs, |rake aborted|SyntaxError|LoadError|NameError|NoMethodError|StandardError|undefined|already exists|cannot load" | head -10 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done
